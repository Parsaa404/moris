services:
  mysql:
    image: mysql:8.0
    container_name: moris_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moris_db
      MYSQL_USER: moris_user
      MYSQL_PASSWORD: moris_dev_password
      MYSQL_ROOT_PASSWORD: moris_root_password
    ports:
      - "3306:3306"
    volumes:
      - moris_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmoris_root_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moris_mysql_data:
